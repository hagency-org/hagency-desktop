<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF preview</title>
<style>
:root { color-scheme: light dark; font: 15px system-ui, sans-serif; }
body { margin: 0; padding: 12px; background: Canvas; color: CanvasText; }
#pages { display: grid; gap: 12px; margin: 0 auto; max-width: 1100px; }
.page { position: relative; display: grid; place-items: center; width: 100%; min-height: 96px; aspect-ratio: 0.77; background: white; color: #242424; box-shadow: 0 1px 4px #0004; }
canvas { display: block; width: 100%; height: 100%; object-fit: contain; }
#status { margin: 1rem; }
</style>
<script type="module" src="reader.mjs"></script>
</head>
<body>
<p id="status" role="status">Loading PDF…</p>
<main id="pages" aria-label="PDF pages"></main>
</body>
</html>
