name: Linux trial

# A trial, not a gate: what of the Desktop checks passes on Linux. Nothing
# depends on it and no pull request starts it. See tools/linux-trial.sh.
on:
  workflow_dispatch:
  # While the trial is worked on, each push to its own branch starts it.
  push:
    branches: [ci/linux-tests]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Fixtures inject SecretStore; CI must never access a runner's native vault.
  HAGENCY_NATIVE_CREDENTIAL_IO: deny

jobs:
  trial:
    name: Linux trial (${{ matrix.part }})
    # GitHub's Linux machine, until the project has Linux machines of its own.
    # Setting the repository variable HAGENCY_LINUX_RUNNER to "own" sends the
    # trial to machines that carry the hagency-linux label.
    runs-on: ${{ vars.HAGENCY_LINUX_RUNNER == 'own' && fromJSON('["self-hosted","linux","x64","hagency-linux"]') || 'ubuntu-24.04' }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        part: [app, gate]
    steps:
      - uses: actions/checkout@v7
      - name: JIT-line makepad checkout
        shell: bash
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - name: Install system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          # The manual-page index is rebuilt after every install and can take
          # minutes on these machines.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
            libssl-dev libsqlite3-dev pkg-config llvm clang libclang-dev cmake \
            libxcursor-dev libx11-dev libasound2-dev libpulse-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev \
            libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Run the part
        run: bash tools/linux-trial.sh ${{ matrix.part }}
      - name: Disk left
        if: always()
        run: df -h / | tail -1
