name: Hagency Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Fixtures inject SecretStore; CI must never access a runner's native vault.
  HAGENCY_NATIVE_CREDENTIAL_IO: deny
  # No step reads this. Naming the two secrets makes GitHub mask the
  # self-hosted machine's name wherever it would appear in this public log.
  MASKED_IN_LOGS: ${{ secrets.CI_MASK_MACHINE_NAME_A }} ${{ secrets.CI_MASK_MACHINE_NAME_B }}

jobs:
  libraries:
    name: Hagency library workspace
    # The project's own Mac runs this job for pushes, manual runs and pull
    # requests from this repository. A pull request from a fork stays on a
    # GitHub machine: a fork never chooses what runs on the project's hardware.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","hagency-mac"]') || 'macos-15' }}
    # The serial all-target and feature-enabled suites can exceed two hours.
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 4
      # Debug schema/fixture construction must not consume another test's
      # bounded inspection deadline. Concurrency scenarios remain inside tests.
      RUST_TEST_THREADS: 1
      RUST_MIN_STACK: 16777216
    defaults:
      run:
        working-directory: crates/hagency-client
    steps:
      - uses: actions/checkout@v7
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        # The project's own Mac keeps its cargo home between runs, and this
        # action would empty that home's bin folder.
        if: runner.environment == 'github-hosted'
        with:
          workspaces: crates/hagency-client -> target
      - name: Build with every core of the project's own Mac
        if: runner.environment == 'self-hosted'
        # Two test programs at a time for every three performance cores. Six
        # was measured on the Mac with ten of them, which runs the native job
        # beside this one; the Mac with six gets the same share, four.
        run: |
          echo "CARGO_BUILD_JOBS=$(sysctl -n hw.ncpu)" >> "$GITHUB_ENV"
          fast=$(sysctl -n hw.perflevel0.physicalcpu)
          echo "PARALLEL_TEST_JOBS=$(( fast * 2 / 3 > 2 ? fast * 2 / 3 : 2 ))" >> "$GITHUB_ENV"
      - run: brew install cmake
      - name: Check Linux qualification helper refusals without provisioning
        run: python3 native/scripts/test-qualify-linux-cgroup.py
      - name: Preserve the offline runtime peer before feature variants rebuild it
        run: |
          cargo build --locked -p hagency-runtime --features shared-context --bin hagency-managed-runtime-probe
          cp target/debug/hagency-managed-runtime-probe "$RUNNER_TEMP/hagency-library-runtime-probe"
          echo "HAGENCY_TEST_RUNTIME_PROBE=$RUNNER_TEMP/hagency-library-runtime-probe" >> "$GITHUB_ENV"
      # These two existing qualification selectors require a live qualified
      # host; their evidence cannot be supplied by a disposable CI runner.
      #
      # tools/parallel-tests.py builds each selection as cargo test does and
      # then starts every test program once, as cargo test does, several
      # programs at a time. The tests of one program still share one process
      # and run one after another (RUST_TEST_THREADS above). Only the unit
      # tests of hagency-matrix, the longest program, run as several
      # processes: none of them chooses the process's writer root, so none
      # depends on which of them ran first.
      #
      # The workspace selection builds each package with its default
      # features, so the tests of shared work that hagency and hagency-store
      # keep behind features run only in the last two selections.
      - name: Library tests, several test programs at a time
        run: >-
          python3 ../../tools/parallel-tests.py --split hagency_matrix,hagency
          --first _process_writer_root::is_selected_before_any_other_test --
          --locked --workspace --all-targets --
          --skip native_codex_real_app_server --skip native_two_agent_qualification_records_its_evidence
          ---
          --locked -p hagency --features shared-budget-execution,resource-adoption --lib
          ---
          --locked -p hagency-store --features shared-budget-execution,resource-adoption --lib
      - name: Check current-profile initialization in isolation
        run: bash ../../tools/check-current-profile.sh
  native:
    name: Native build and unit tests
    # As for the library workspace: the project's own Mac, except for forks.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","macOS","ARM64","hagency-mac"]') || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: |
            . -> target
            tools/hagency-script-review -> target
            crates/owner-dashboard -> target
            crates/hagency-client -> target
      - run: brew install cmake
      - name: Verify TSP timeline signatures
        run: cargo test --locked --profile fast --lib --features tsp tsp::message_signature::tests
      - run: cargo test --locked --manifest-path crates/miniapp-core/Cargo.toml
      - run: cargo test --locked --manifest-path crates/miniapp-catalog/Cargo.toml
      - run: cargo test --locked --manifest-path crates/system-apps/Cargo.toml
      - run: bash tools/package-system-apps/check.sh
      - run: python3 tools/test_package_octos.py
      - run: python3 tools/test-release-kernel.py
      - run: python3 tools/check-release-icons.py
      - run: cargo test --locked --features agent_chat,octosense-module --lib
      - name: Check how the regression gate runs its checks
        run: python3 tools/test-hagency-regressions-runner.py
      - name: Check how the library tests run a failed process once more
        run: python3 tools/test-parallel-tests.py
      - name: Budget and chat regression gate
        # Four checks at a time on the project's own Mac, which runs the
        # library job beside this one; one after another on GitHub's. A check
        # whose tests failed runs once more and is named when only that run
        # passed. The release workflow gives no second run.
        run: >-
          python3 tools/check-hagency-regressions.py --output .run/ci-regressions
          --jobs ${{ runner.environment == 'self-hosted' && 4 || 1 }} --second-run
      - run: cargo build --locked --features agent_chat
      - run: cargo check --locked --no-default-features --features agent_chat
      - run: python3 tools/wechat-ux/check_i18n.py
      - run: python3 tools/check_theme_literals.py
  article-core:
    name: Portable article core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JIT-line makepad checkout
        shell: bash
        working-directory: ${{ github.workspace }}
        run: if [ -f .jit/sources.sh ]; then bash .jit/sources.sh; fi
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/article-core
      - run: cargo test --locked --manifest-path crates/article-core/Cargo.toml
      - run: cargo test --locked --manifest-path crates/theme-contract/Cargo.toml
