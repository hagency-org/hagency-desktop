[package]
name = "hagency-agent-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hagency-runtime = { path = "../hagency-runtime" }
hagency-platform = { path = "../hagency-platform" }
getrandom.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rusqlite = { workspace = true, features = ["bundled", "fallible_uint"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["std", "parsing"] }
tokio = { workspace = true, features = ["process", "io-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
hagency-platform = { path = "../hagency-platform", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
